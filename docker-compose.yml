version: '3.8'

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: schoolx_rag_bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - bot_data:/app/data
      - bot_logs:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  bot_data:
  bot_logs:
